# agent-pmo:a72c926
edition = "2024"
max_width = 100
use_small_heuristics = "Default"
# The options below are nightly-gated: stable rustfmt prints "unstable features
# are only available in nightly" and ignores them. They are kept so the intended
# style is declared in one place and takes effect verbatim under nightly.
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
format_code_in_doc_comments = true
wrap_comments = true
comment_width = 100
normalize_comments = true
normalize_doc_attributes = true
